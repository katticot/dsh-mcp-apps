name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  pr_agent:
    # Public repo: run on non-draft PRs from this repo (fork PRs get no secrets), or on
    # PR comments starting with "/" from the owner, members or collaborators only.
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
         startsWith(github.event.comment.body, '/') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: The-PR-Agent/pr-agent@efdde4afe14aa401a3889012c7f3e9ef3081a430 # v0.49.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL.KEY: ${{ secrets.MISTRAL_KEY }}
          CONFIG.MODEL: mistral/zai-glm-5-3
          CONFIG.FALLBACK_MODELS: '["mistral/mistral-large-latest"]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "200000"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
