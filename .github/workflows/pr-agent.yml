name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  pr_agent:
    # Non-draft PRs from this repo, or "/" commands on PRs from the owner, members or collaborators.
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
         startsWith(github.event.comment.body, '/') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip fork PRs
        id: gate
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: echo "fork=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)" >> "$GITHUB_OUTPUT"

      - name: Load reviewer config
        if: steps.gate.outputs.fork != 'true'
        env:
          CFG: ${{ secrets.PR_AGENT_ENV }}
        run: |
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            name="${line%%=*}"
            value="${line#*=}"
            echo "::add-mask::$value"
            for part in ${name%%.*} $(printf '%s' "$value" | tr '/[],"' ' '); do
              [ ${#part} -gt 3 ] && [ "$part" != CONFIG ] || continue
              lower=$(printf '%s' "$part" | tr '[:upper:]' '[:lower:]')
              upper=$(printf '%s' "$part" | tr '[:lower:]' '[:upper:]')
              for v in "$part" "$lower" "$upper" "$(printf '%s' "${lower:0:1}" | tr '[:lower:]' '[:upper:]')${lower:1}"; do
                echo "::add-mask::$v"
              done
            done
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$CFG"

      - uses: The-PR-Agent/pr-agent@efdde4afe14aa401a3889012c7f3e9ef3081a430 # v0.49.0
        if: steps.gate.outputs.fork != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
