name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22.x ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build plugin
        run: pnpm build

      - name: Verify packed client and host artifact
        run: pnpm test:artifact

      - name: Pack candidate artifact
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
          echo "PACKAGE_TARBALL=dist/dsh-mcp-apps-$(node -p \"require('./package.json').version\").tgz" >> "$GITHUB_ENV"

      - name: Install headless browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test packed DSH artifact
        run: |
          for policy in allow deny approve; do
            pnpm test:smoke "$PACKAGE_TARBALL" --policy="$policy"
          done
