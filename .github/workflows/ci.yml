name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22.x ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build and verify client and host artifact
        run: pnpm test:artifact

      - name: Pack candidate artifact
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
          echo "PACKAGE_TARBALL=dist/dsh-mcp-apps-$(node -p "require('./package.json').version").tgz" >> "$GITHUB_ENV"

      - name: Install headless browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test packed DSH artifact
        run: |
          for policy in allow deny approve; do
            pnpm test:smoke "$PACKAGE_TARBALL" --policy="$policy"
          done

      - name: Install npm with OIDC trusted-publishing support
        run: |
          npm install -g npm@11.20.0
          npm --version

      - name: Guard against npm publish tarball path misparse
        run: |
          set -euo pipefail
          # Re-pack the already-verified tarball under a throwaway, never-published
          # prerelease version so the dry-run publish doesn't fail once the real
          # version has been published to the registry (see run 36349424582).
          # The point of this guard is the argument SHAPE ("./<tarball>"), which is
          # what defeats npm-package-arg treating a bare `dist/x.tgz` as a
          # git/hosted-shorthand reference - not the specific version being dry-run
          # published.
          GUARD_DIR="$(mktemp -d)"
          tar -xzf "$PACKAGE_TARBALL" -C "$GUARD_DIR"
          GUARD_VERSION="0.0.0-ci.${GITHUB_SHA::12}"
          (cd "$GUARD_DIR/package" && npm pkg set version="$GUARD_VERSION")
          (cd "$GUARD_DIR/package" && npm pack --pack-destination "$GUARD_DIR")
          GUARD_TARBALL="$(basename "$(ls -t "$GUARD_DIR"/*.tgz | head -n1)")"
          (cd "$GUARD_DIR" && npm publish "./$GUARD_TARBALL" --dry-run --ignore-scripts --tag ci)
